<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shobitha Sajjehundi Mahadesh | Finance</title>
<meta name="description" content="Fund accounting and FinTech portfolio: private equity, NAV, AIFMD reporting, tokenized funds and valuation projects.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23b07a4f' font-family='Georgia,serif' font-weight='700'%3ESM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--bg:#f6f6f6;--mute:#5f5a55;--line:#e0dcd7;--teal:#6b4226;--gold:#b07a4f;--card:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "DM Sans",system-ui,sans-serif}
a{color:var(--teal)}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:10;background:rgba(17,17,17,.95);backdrop-filter:blur(6px)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:58px}
nav b{font:700 1.05rem Fraunces,Georgia,serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
nav a{color:#d6cfc8;text-decoration:none;margin-left:18px;font-size:.93rem}nav a:hover{color:#fff}
.hero{background:var(--ink);color:#fff;padding:64px 0 48px}
.top{display:grid;grid-template-columns:270px 1fr;gap:44px;align-items:center}
.photo{display:block;width:250px;height:430px;border-radius:14px;object-fit:cover;object-position:center top;border:4px solid var(--gold);box-shadow:0 0 0 10px #1c1a18}
.status{color:var(--gold);font-weight:700;font-size:.95rem;margin:0 0 12px}
h1{font:700 clamp(2.2rem,5vw,3.6rem)/1.05 Fraunces,Georgia,serif;margin:0 0 16px;letter-spacing:-.02em}
.hl{font-size:1.25rem;margin:0 0 12px}.sum{color:#cfc8c1;margin:0 0 24px;max-width:38em}
.btn{display:inline-block;padding:11px 20px;border-radius:6px;border:2px solid var(--gold);text-decoration:none;font-weight:700;margin:0 10px 10px 0;color:#fff}
.btn.p{background:var(--gold);color:var(--ink)}
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px}
.stat{border:1px solid #3a3430;border-radius:10px;padding:16px;background:#1c1a18}
.stat b{display:block;font:700 2.3rem/1 Fraunces,Georgia,serif;color:var(--gold)}
.stat span{display:block;margin-top:8px;font-size:.85rem;color:#cfc8c1;line-height:1.4}
section{padding:56px 0;border-bottom:1px solid var(--line)}
h2{font:700 1.9rem/1.2 Fraunces,Georgia,serif;margin:0 0 8px}
.lead{color:var(--mute);margin:0 0 26px;max-width:42em}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.three div{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:8px;padding:18px}
.three h3{margin:0 0 6px;font-size:1.05rem}.three p{margin:0;color:var(--mute);font-size:.95rem}
.skillgrp{margin-bottom:18px}.skillgrp h3{font-size:1rem;margin:0 0 8px}
.chip{display:inline-block;background:#ece6e0;border:1px solid transparent;border-radius:5px;padding:4px 11px;margin:0 6px 7px 0;font-size:.92rem;color:var(--ink)}
button.chip:hover{border-color:var(--teal)}button.chip.on{background:var(--teal);color:#fff}
.tags .chip{font-size:.8rem;padding:2px 8px;background:#f1ede9}.tags .chip.hit{background:var(--gold);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:8px;margin-bottom:16px;transition:opacity .2s,box-shadow .2s}
.card.hit{box-shadow:0 0 0 3px var(--gold)}.card.dim{opacity:.4}
details.card summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font:700 1.5rem/1 DM Sans;color:var(--teal);margin-left:auto}
details[open].card summary::after{content:"–"}
.card h3{margin:0;font-size:1.12rem}.meta{color:var(--mute);font-size:.93rem}
.body{padding:0 22px 20px}.body ul{margin:8px 0 14px;padding-left:20px}.body li{margin-bottom:6px}
article.card{padding:22px 24px;border-left-color:var(--gold)}
.q{font:600 1.05rem/1.4 Fraunces,Georgia,serif;margin:10px 0 14px}
.tp{display:grid;grid-template-columns:1fr 2fr;gap:20px;margin-bottom:12px}
.tp b{display:block;font-size:.85rem;color:var(--teal);margin-bottom:4px}.tp p,.tp ul{margin:0}.tp ul{padding-left:18px}.tp li{margin-bottom:4px}
.learn{margin:0 0 12px}.learn b{display:block;font-size:.85rem;color:var(--teal);margin-bottom:4px}.learn ul{margin:0;padding-left:18px}.learn li{margin-bottom:4px}
.res{background:#f1ede9;border-left:3px solid var(--gold);padding:10px 14px;margin:0 0 12px;border-radius:0 6px 6px 0}.res b{display:block;font-size:.85rem;color:var(--teal);margin-bottom:4px}.res ul{margin:0;padding-left:18px}.res li{margin-bottom:4px}
.cl{margin:8px 0 0;padding-left:18px}.cl li{margin-bottom:8px;font-size:.95rem}
.grp{font:700 1.35rem Fraunces,Georgia,serif;margin:36px 0 2px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;margin-top:14px}.cards .card{margin:0}.cards .q{font-size:1rem;margin:8px 0 10px}.cards h3 a{color:var(--ink);text-decoration:none}.cards h3 a:hover{color:var(--teal);text-decoration:underline}.bl{margin:8px 0 12px;color:var(--mute);font-size:.97rem}.rs{margin:0 0 10px;padding-left:18px;font-size:.95rem}.rs li{margin-bottom:3px}
.proof{margin:4px 0 10px}.proof a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;padding:7px 14px;border-radius:6px;margin-right:8px}.proof a.ov{background:var(--teal)}.proof a:hover{background:var(--teal)}
.filters{margin-bottom:18px}.filters button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 16px;margin:0 8px 8px 0}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid2 .card{margin:0}
.edu{padding:18px 22px}.edu p{margin:4px 0 0}
.beyond{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.beyond div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.beyond b{display:block;margin-bottom:4px}
.contact a.btn{color:var(--ink);border-color:var(--ink)}.contact a.btn.p{background:var(--ink);color:#fff}
#bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;display:none;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#bar button{background:var(--gold);border:0;border-radius:20px;padding:3px 12px;margin-left:10px;font-weight:700}
footer{padding:36px 0 60px;color:var(--mute)}
@media(max-width:760px){.top,.grid2,.beyond,.three,.tp{grid-template-columns:1fr}.snap{grid-template-columns:1fr 1fr}.photo{width:190px;height:326px;margin:0 auto}nav a{margin-left:10px;font-size:.8rem}}
@media(max-width:560px){nav a:nth-child(n+3){display:none}nav b{font-size:.9rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
.btn{display:inline-flex;align-items:center;gap:8px}.btn svg,.proof svg{width:16px;height:16px;flex:none}
.proof{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.proof a{display:inline-flex;align-items:center;gap:8px;margin:0;padding:10px 16px;border-radius:8px;font-weight:700;font-size:.9rem;text-decoration:none;background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.proof a:hover{background:var(--ink);color:#fff}
.proof a.ov{background:var(--teal);border-color:var(--teal);color:#fff}
.proof a.ov:hover{background:var(--ink);border-color:var(--ink)}
.cards article.card{padding:24px 26px}
.logo{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--ink);font:700 .78rem "DM Sans",sans-serif;margin-right:10px;vertical-align:middle;letter-spacing:.02em}
</style>
</head>
<body>
<nav><div class="wrap"><b id="brand"></b><div><a href="#projects">Work</a><a href="#experience">Experience</a><a href="#skills">Skills</a><a href="#education">Education</a><a href="#contact">Contact</a></div></div></nav>
<header class="hero"><div class="wrap top"><div id="ph"></div><div id="hero"></div></div><div class="wrap snap" id="stats"></div></header>
<main class="wrap">
  <section id="approach"></section>
  <section id="projects"></section>
  <section id="experience"></section>
  <section id="skills"></section>
  <section id="education"></section>
  <section id="certs"></section>
  <section id="beyond"></section>
  <section id="contact" class="contact"></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="bar" role="status"></div>
<script>
fetch("data/profile.json").then(r=>r.json()).then(d=>{
const S=x=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${x}</svg>`;
const I={
link:S('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'),
doc:S('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8"/>'),
sheet:S('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>'),
gh:S('<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>'),
li:S('<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>'),
hs:S('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
mail:S('<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/>'),
ph:S('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>'),
dl:S('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>'),
arrow:S('<path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>')};
const ico=u=>/\.pdf$/i.test(u)?I.doc:/\.xlsx?$/i.test(u)?I.sheet:/github\.com|\.ipynb$/i.test(u)?I.gh:/lnkd\.in|linkedin\.com/i.test(u)?I.li:/joinhandshake/i.test(u)?I.hs:I.link;
const $=id=>document.getElementById(id),L=d.links,H=d.headings,tel=L.phone.replace(/[^+\d]/g,""),
hd=k=>`<h2>${H[k][0]}</h2>${H[k][1]?`<p class="lead">${H[k][1]}</p>`:""}`,
tg=t=>`<div class="tags">${t.map(x=>`<span class="chip" data-t="${x}">${x}</span>`).join("")}</div>`;
document.title=d.short+" | Finance";$("brand").innerHTML=`<span class="logo">SM</span>${d.short}`;
$("ph").innerHTML=d.photo?`<img class="photo" src="${d.photo}" alt="Photo of ${d.name}" onerror="this.remove()">`:"";
$("hero").innerHTML=`<p class="status">${d.status}</p><h1>${d.name}</h1><p class="hl">${d.headline}</p><p class="sum">${d.summary}</p>
<a class="btn p" href="mailto:${L.email}">${I.mail}Email me</a><a class="btn" href="${L.resume}">${I.dl}Download résumé</a><a class="btn" href="${L.linkedin}">${I.li}LinkedIn</a>${L.handshake?`<a class="btn" href="${L.handshake}">${I.hs}Handshake</a>`:""}`;
$("stats").innerHTML=d.stats.map(s=>`<div class="stat"><b data-v="${s.value}" data-s="${s.suffix}">${s.value}${s.suffix}</b><span>${s.label}</span></div>`).join("");
$("approach").innerHTML=hd("approach")+`<div class="three">${d.approach.map(a=>`<div><h3>${a.title}</h3><p>${a.text}</p></div>`).join("")}</div>`;
const grp=[["Field project","Hands-on consulting work for an industry client."],["Academic projects","Coursework, competitions and independent analysis where theory became a model, a portfolio or a recommendation."],["Internship","Industry experience during my PGDM."]];
const card=p=>`<article class="card" data-tags="${p.tags.join("|")}"><div class="meta">${p.type}${p.period?" · "+p.period:""} · ${p.org}</div><h3><a href="project.html?p=${p.id}">${p.title}</a></h3><p class="bl">${p.blurb}</p><div class="proof"><a class="ov" href="project.html?p=${p.id}">View project overview${I.arrow}</a>${p.proof.map(x=>`<a href="${x.url}" target="_blank" rel="noopener">${ico(x.url)}${x.label}</a>`).join("")}${p.proofNote?`<span class="meta">${p.proofNote}</span>`:""}</div></article>`;
$("projects").innerHTML=hd("projects")+grp.map(([g,t])=>{const ps=d.projects.filter(p=>p.category===g);return ps.length?`<h3 class="grp">${g}</h3><p class="meta">${t}</p><div class="cards">${ps.map(card).join("")}</div>`:""}).join("");
$("experience").innerHTML=hd("experience")+d.experience.map((e,i)=>`<details class="card" data-tags="${e.tags.join("|")}" ${i?"":"open"}>
<summary><div><h3>${e.title}, ${e.company}</h3><div class="meta">${e.place}</div></div><div class="meta">${e.start} – ${e.end}</div></summary>
<div class="body"><p>${e.summary}</p><ul>${e.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>${tg(e.tags)}</div></details>`).join("");
$("skills").innerHTML=hd("skills")+Object.entries(d.skills).map(([g,v])=>`<div class="skillgrp"><h3>${g}</h3>${v.map(s=>`<button class="chip" data-skill="${s}">${s}</button>`).join("")}</div>`).join("");
$("education").innerHTML=hd("education")+`<div class="grid2">`+d.education.map(e=>`<div class="card edu"><div class="meta">${e.years}</div><h3>${e.degree}</h3><p>${e.school}</p>${e.detail?`<p class="meta">${e.detail}</p>`:""}</div>`).join("")+`</div>`;
$("certs").innerHTML=hd("certifications")+`<div class="three">${d.certifications.map(g=>`<div><h3>${g.issuer}</h3><ul class="cl">${g.items.map(c=>`<li>${c.name}<span class="meta"> · ${c.date}</span>${c.link?` <a href="${c.link}" target="_blank" rel="noopener">View ↗</a>`:""}</li>`).join("")}</ul></div>`).join("")}</div>`;
$("beyond").innerHTML=hd("beyond")+`<div class="beyond">${d.beyond.map(b=>`<div><b>${b.label}</b>${b.text}</div>`).join("")}</div>`;
$("contact").innerHTML=hd("contact")+`<p><a class="btn p" href="mailto:${L.email}">${I.mail}Email me</a><a class="btn" href="tel:${tel}">${I.ph}${L.phone}</a><a class="btn" href="${L.linkedin}">${I.li}LinkedIn</a>${L.handshake?`<a class="btn" href="${L.handshake}">${I.hs}Handshake</a>`:""}<a class="btn" href="${L.resume}">${I.doc}Résumé (PDF)</a></p>
<p class="meta">${L.email} · ${L.email2}</p>`;
$("foot").textContent="© "+new Date().getFullYear()+" "+d.name;
let active=null;const bar=$("bar");
function mark(){document.querySelectorAll(".card[data-tags]").forEach(c=>{const h=!!active&&c.dataset.tags.split("|").includes(active);c.classList.toggle("hit",h);c.classList.toggle("dim",!!active&&!h);if(h&&c.tagName==="DETAILS")c.open=true});
document.querySelectorAll(".tags .chip").forEach(c=>c.classList.toggle("hit",c.dataset.t===active));
document.querySelectorAll("[data-skill]").forEach(c=>c.classList.toggle("on",c.dataset.skill===active));
bar.style.display=active?"block":"none";if(active)bar.innerHTML=`Showing where I used <b>${active}</b><button id="clr">Clear</button>`}
document.addEventListener("click",e=>{const s=e.target.closest("[data-skill]");
if(s){active=active===s.dataset.skill?null:s.dataset.skill;mark();if(active)$("projects").scrollIntoView();return}
if(e.target.id==="clr"){active=null;mark();return}
const f=e.target.closest("[data-f]");if(f){document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("on",b===f));
document.querySelectorAll("#projects article.card").forEach(c=>c.hidden=f.dataset.f!=="All"&&c.dataset.type!==f.dataset.f)}});
if(!matchMedia("(prefers-reduced-motion:reduce)").matches){const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;io.unobserve(en.target);const el=en.target,v=+el.dataset.v,t0=performance.now();
(function step(t){const p=Math.min((t-t0)/1200,1);el.textContent=Math.round(v*p)+(p===1?el.dataset.s:"");if(p<1)requestAnimationFrame(step)})(t0)}));
document.querySelectorAll(".stat b").forEach(b=>{b.textContent="0";io.observe(b)})}
}).catch(()=>{document.getElementById("hero").textContent="Could not load data/profile.json. Check that the data folder and file name are correct."});
</script>
</body>
</html>
